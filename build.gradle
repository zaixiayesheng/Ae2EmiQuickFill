plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.74'
}

group = mod_group_id
version = mod_version

base {
    // 产物名带游戏版本：ae2_emi_quick_fill-1.21.1-1.0.0.jar
    archivesName = "${mod_id}-${minecraft_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_version as int)
    }
}

neoForge {
    version = neo_version

    mods {
        create(mod_id) {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
        content {
            includeGroup 'org.appliedenergistics'
            includeGroup 'appeng'
        }
    }
}

dependencies {
    // AE2 从 modmaven.dev 拉取；AE2 更新时改 gradle.properties 里的 ae2_version
    compileOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}"

    // EMI 走 libs/ 本地 jar：Emi 的 maven（TerraformersMC → repo.sleeping.town）在国内经常连不上，
    // 拉不到时把 emi-neoforge-<version>.jar 放进 libs/ 再编译（该目录的 jar 不入版本控制）
    // EMI 走 libs/ 本地 jar，按文件名挑本分支那份
    compileOnly fileTree(dir: 'libs', include: ['*1.21.1*.jar'])
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

processResources {
    def replaceProperties = [
            mod_id         : mod_id,
            mod_name       : mod_name,
            mod_version    : mod_version,
            mod_group_id   : mod_group_id,
            mod_authors    : mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        filteringCharset = 'UTF-8'
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : mod_version,
            'Implementation-Vendor'   : mod_authors
        ])
    }
}
