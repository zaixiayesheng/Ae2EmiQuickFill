plugins {
    id 'java-library'
    // 1.20.1 的 Forge 用 ModDevGradle 的 legacyforge 插件
    id 'net.neoforged.moddev.legacyforge' version '2.0.134'
}

group = mod_group_id
version = mod_version

base {
    // 产物名带游戏版本：emi_ae2_shift_craft-1.20.1-1.0.0.jar
    archivesName = "${mod_id}-${minecraft_version}"
}

// 这个分支的工具链只认 JDK 17，见 README 的说明
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_version as int)
    }
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        create(mod_id) {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
        content {
            // 1.20.1 的 AE2 在 ModMaven 上是老坐标：appeng:appliedenergistics2-forge
            includeGroup 'appeng'
        }
    }
}

dependencies {
    compileOnly "appeng:appliedenergistics2-forge:${ae2_version}"

    // EMI 走 libs/ 本地 jar：Emi 的 maven（TerraformersMC → repo.sleeping.town）国内经常连不上，
    // 拉不到时把 emi-<version>.jar 放进 libs/ 再编译（该目录的 jar 不入版本控制）
    // 只取本分支要的那个 jar：libs/ 里可能同时躺着别的分支的 EMI，靠文件名里的游戏版本区分
    compileOnly fileTree(dir: 'libs', include: ['*1.20.1*.jar'])
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

processResources {
    def replaceProperties = [
            mod_id         : mod_id,
            mod_name       : mod_name,
            mod_version    : mod_version,
            mod_group_id   : mod_group_id,
            mod_authors    : mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        filteringCharset = 'UTF-8'
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : mod_version,
            'Implementation-Vendor'   : mod_authors
        ])
    }
}
