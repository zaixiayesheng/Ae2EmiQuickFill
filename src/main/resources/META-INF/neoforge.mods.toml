modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
${mod_description}'''
logoFile = "icon.png"
displayTest = "IGNORE_ALL_VERSION"

[[mixins]]
config = "emi_ae2_shift_craft.mixins.json"

[[dependencies.${mod_id}]]
